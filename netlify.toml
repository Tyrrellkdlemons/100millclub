# 100MillClub — Netlify configuration
# Static single-file site: nothing to build, publish the repo root as-is.

[build]
  publish = "."
  command = ""

# SPA-style fallback so any path (e.g. /vlog/v1) still serves the terminal.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
