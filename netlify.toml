# 100MillClub — Netlify configuration
# Static site, no build step. Publish the repo root as-is.

[build]
  publish = "."
  command = ""

# Repo housekeeping ships with the publish dir (root); don't serve it.
# force = true is what beats the on-disk files — these must sit above the
# SPA catch-all, because the first matching rule wins.
[[redirects]]
  from = "/README.md"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/"
  status = 301
  force = true

# Serve the terminal for any path, so share links like /vlog/v1 resolve.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# HTML should always revalidate so deploys land immediately.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The CSS and JS filenames carry no content hash, because there is no build
# step to add one. Caching them for any length of time therefore pairs a
# freshly revalidated index.html with stale scripts, and the app breaks with
# "x is not a function" until the cache expires. Revalidate them too —
# Netlify sends ETags, so an unchanged file costs a 304 and no body.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The logo does not change, so it can be cached properly.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
